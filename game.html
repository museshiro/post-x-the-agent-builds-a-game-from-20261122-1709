<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON FLIP — tap untuk balik gravitasi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #05030f; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #eaf6ff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #wrap { position: relative; width: min(100vw, 56.25vh); height: min(100vh, 177.78vw); }
  canvas { display: block; width: 100%; height: 100%; background: #05030f; cursor: pointer; }
  #hud {
    position: absolute; top: 3.2%; left: 0; right: 0; text-align: center;
    pointer-events: none; text-shadow: 0 0 18px rgba(0, 229, 255, .8);
  }
  #score { font-size: clamp(44px, 11vw, 84px); font-weight: 800; line-height: 1; color: #00e5ff; }
  #best { font-size: clamp(13px, 3.2vw, 20px); color: #9be7ff; opacity: .85; margin-top: 4px; letter-spacing: .12em; }
  #banner {
    position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
    padding: 0 6%;
  }
  #banner h1 {
    font-size: clamp(40px, 10.5vw, 76px); font-weight: 900; letter-spacing: .04em; line-height: .95;
    color: #ff2fb3;
    text-shadow: 0 0 12px #ff2fb3, 0 0 42px rgba(255, 47, 179, .65), 0 0 90px rgba(255, 47, 179, .35);
  }
  #banner p { margin-top: 14px; font-size: clamp(15px, 4vw, 24px); color: #d9f7ff; line-height: 1.45;
    text-shadow: 0 0 14px rgba(0, 229, 255, .6); }
  #banner .tap {
    display: inline-block; margin-top: 18px; padding: 10px 22px; border: 2px solid #00e5ff;
    border-radius: 999px; color: #00e5ff; font-weight: 700; letter-spacing: .14em;
    font-size: clamp(14px, 3.6vw, 21px);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.07); opacity: .75; } }
  #foot {
    position: absolute; bottom: 1.6%; left: 0; right: 0; text-align: center; pointer-events: none;
    font-size: clamp(10px, 2.6vw, 15px); color: #7fa8c9; letter-spacing: .08em;
  }
  #foot b { color: #ff5ec4; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="960"></canvas>
  <div id="hud"><div id="score">0</div><div id="best">TERBAIK 0</div></div>
  <div id="banner">
    <h1>NEON<br>FLIP</h1>
    <p id="bannerText">Tap di mana saja untuk membalik gravitasi.<br>Lewati celah gate neon — satu tabrakan, selesai.</p>
    <span class="tap" id="tapHint">TAP UNTUK MULAI</span>
  </div>
  <div id="foot">1 PROMPT &middot; 0 CODING &middot; DIBANGUN AGENT &middot; <b>make.fun/r/xrr5vp10</b></div>
</div>
<script>
"use strict";
/* NEON FLIP — gravity-flip arcade. Satu file, tanpa dependensi.
   Fisika: kubus jatuh ke satu arah sampai tap membalik gravitasi.
   Langit-langit dan lantai aman (kubus meluncur di sana); gate yang membunuh. */
const W = 540, H = 960;
const CUBE_X = 150, CUBE = 44;          // posisi & ukuran kubus
const GRAV = 2600;                       // px/s^2
const VMAX = 950;                        // batas kecepatan jatuh
const GATE_W = 46;                       // lebar tiang gate
const SPAWN_DX = 360;                    // jarak antar gate
const BASE_SPEED = 400;                  // px/s awal
const SPEED_STEP = 22;                   // + tiap 5 gate
const GAP_START = 230, GAP_MIN = 196;    // tinggi celah gate

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const banner = document.getElementById("banner");
const bannerText = document.getElementById("bannerText");
const tapHint = document.getElementById("tapHint");

/* RNG deterministik: urutan celah gate sama di setiap run pertama,
   supaya video gameplay dan game yang dimainkan orang berbagi dunia yang sama. */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let state = "ready";           // ready | playing | dead
let y, vy, gravDir;            // posisi, kecepatan, arah gravitasi (+1 jatuh / -1 naik)
let gates = [];                // {x, gapY, gapH, passed}
let lastGapY = H / 2;          // celah gate sebelumnya (batas lompat antar gate)
let score, best, shake, flash, deadT;
let parts = [];                // partikel {x,y,vx,vy,life,color,size}
let rng;
let last = performance.now();

try { best = parseInt(localStorage.getItem("neonflip-best") || "0", 10) || 0; }
catch (e) { best = 0; }

function gapFor(n) {
  // celah menyempit pelan seiring skor, tidak pernah di bawah GAP_MIN
  return Math.max(GAP_MIN, GAP_START - n * 2);
}
function speedFor(n) {
  return BASE_SPEED + SPEED_STEP * Math.floor(n / 5);
}
function spawnGate(x) {
  const gapH = gapFor(gates.length + score);
  const margin = 120;
  let gapY = margin + gapH / 2 + rng() * (H - 2 * margin - gapH);
  // celah berurutan tidak pernah lompat lebih dari 180px: transisi
  // antar gate harus selalu mungkin ditempuh manusia dalam satu interval
  gapY = Math.max(lastGapY - 180, Math.min(lastGapY + 180, gapY));
  lastGapY = gapY;
  gates.push({ x: x, gapY: gapY, gapH: gapH, passed: false });
}
function reset() {
  rng = mulberry32(20261124);
  y = H - CUBE / 2; vy = 0; gravDir = 1;
  gates = []; lastGapY = H / 2; score = 0; shake = 0; flash = 0; deadT = 0; parts = [];
  spawnGate(W + 160);
  spawnGate(W + 160 + SPAWN_DX);
  updateHud();
}
function updateHud() {
  scoreEl.textContent = String(score);
  bestEl.textContent = "TERBAIK " + Math.max(best, score);
}
function flip() {
  if (state === "ready") { start(); return; }
  if (state === "dead") {
    if (performance.now() - deadT > 350) { start(); }   // jeda singkat anti-tap-ganda
    return;
  }
  gravDir = -gravDir;
  burst(CUBE_X + CUBE / 2, gravDir > 0 ? y - CUBE / 2 : y + CUBE / 2, 6, "#00e5ff");
}
function start() {
  reset();
  state = "playing";
  banner.style.display = "none";
}
function die() {
  state = "dead";
  deadT = performance.now();
  shake = 14; flash = 0.9;
  burst(CUBE_X + CUBE / 2, y, 26, "#ff2fb3");
  burst(CUBE_X + CUBE / 2, y, 14, "#00e5ff");
  if (score > best) {
    best = score;
    try { localStorage.setItem("neonflip-best", String(best)); } catch (e) {}
  }
  updateHud();
  banner.style.display = "block";
  bannerText.innerHTML = "TABRAKAN DI GATE " + (score + 1) + ".<br>Skor akhir: <b style='color:#00e5ff'>" +
    score + "</b> gate &middot; Terbaik: " + best + ".<br>Lewat 20 gate? Coba lagi.";
  tapHint.textContent = "TAP UNTUK RETRY";
}
function burst(x, yy, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 260;
    parts.push({ x: x, y: yy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5 + Math.random() * 0.5, max: 1, color: color, size: 2 + Math.random() * 4 });
  }
}
function step(dt) {
  if (state !== "playing") return;
  const speed = speedFor(score);
  vy += gravDir * GRAV * dt;
  if (vy > VMAX) vy = VMAX;
  if (vy < -VMAX) vy = -VMAX;
  y += vy * dt;
  // lantai & langit-langit aman: kubus meluncur, kecepatan direset
  if (y > H - CUBE / 2) { y = H - CUBE / 2; if (vy > 0) vy = 0; }
  if (y < CUBE / 2) { y = CUBE / 2; if (vy < 0) vy = 0; }
  for (const g of gates) g.x -= speed * dt;
  // spawn gate baru tepat satu jarak di belakang gate terakhir
  if (gates.length && gates[gates.length - 1].x < W) {
    spawnGate(gates[gates.length - 1].x + SPAWN_DX);
  }
  gates = gates.filter(g => g.x > -GATE_W - 40);
  const cx0 = CUBE_X + 4, cx1 = CUBE_X + CUBE - 4;
  const cy0 = y - CUBE / 2 + 4, cy1 = y + CUBE / 2 - 4;
  for (const g of gates) {
    if (!g.passed && g.x + GATE_W < CUBE_X) {
      g.passed = true; score++;
      updateHud();
      burst(CUBE_X + CUBE / 2, y, 8, "#ffe94d");
    }
    const gx0 = g.x, gx1 = g.x + GATE_W;
    const top0 = 0, top1 = g.gapY - g.gapH / 2;
    const bot0 = g.gapY + g.gapH / 2, bot1 = H;
    const hit = cx0 < gx1 && cx1 > gx0 &&
      ((cy0 < top1 && cy1 > top0) || (cy0 < bot1 && cy1 > bot0));
    if (hit) { die(); return; }
  }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
}
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0a0626"); g.addColorStop(0.55, "#05030f"); g.addColorStop(1, "#12042a");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // grid neon redup
  ctx.strokeStyle = "rgba(0,229,255,0.07)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 54) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let yy = 0; yy <= H; yy += 96) { ctx.moveTo(0, yy); ctx.lineTo(W, yy); }
  ctx.stroke();
  // garis lantai & langit-langit
  ctx.fillStyle = "rgba(255,47,179,0.55)";
  ctx.fillRect(0, 0, W, 3); ctx.fillRect(0, H - 3, W, 3);
  ctx.fillStyle = "rgba(0,229,255,0.35)";
  ctx.fillRect(0, 3, W, 1); ctx.fillRect(0, H - 4, W, 1);
}
function drawGate(g) {
  const top1 = g.gapY - g.gapH / 2, bot0 = g.gapY + g.gapH / 2;
  ctx.save();
  ctx.shadowColor = "#ff2fb3"; ctx.shadowBlur = 22;
  ctx.fillStyle = "#ff2fb3";
  ctx.fillRect(g.x, 0, GATE_W, top1);
  ctx.fillRect(g.x, bot0, GATE_W, H - bot0);
  ctx.restore();
  // tepi celah: garis cyan terang penanda jalan
  ctx.fillStyle = "#00e5ff";
  ctx.fillRect(g.x - 3, top1 - 4, GATE_W + 6, 4);
  ctx.fillRect(g.x - 3, bot0, GATE_W + 6, 4);
  // inti gelap tiang
  ctx.fillStyle = "rgba(10,2,24,0.55)";
  ctx.fillRect(g.x + 10, 0, GATE_W - 20, top1);
  ctx.fillRect(g.x + 10, bot0, GATE_W - 20, H - bot0);
}
function drawCube() {
  const cx = CUBE_X + CUBE / 2;
  ctx.save();
  ctx.translate(cx, y);
  ctx.rotate(gravDir > 0 ? 0.12 : Math.PI + 0.12);
  ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 30;
  ctx.fillStyle = "#00e5ff";
  ctx.fillRect(-CUBE / 2, -CUBE / 2, CUBE, CUBE);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#062a33";
  ctx.fillRect(-CUBE / 2 + 7, -CUBE / 2 + 7, CUBE - 14, CUBE - 14);
  ctx.fillStyle = "#ff2fb3";
  ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // jejak gerak
  ctx.fillStyle = "rgba(0,229,255,0.25)";
  ctx.fillRect(CUBE_X - 26, y - 5, 22, 10);
  ctx.fillStyle = "rgba(0,229,255,0.12)";
  ctx.fillRect(CUBE_X - 52, y - 3, 20, 6);
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000 || 0.016);
  last = now;
  // substep fisika (<= 1/120 dtk) supaya lintasan tidak bergantung
  // pada frame rate dan sama dengan simulasi video (dt 1/240 dtk)
  const n = Math.max(1, Math.ceil(dt / (1 / 120)));
  for (let i = 0; i < n; i++) step(dt / n);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  for (const g of gates) drawGate(g);
  drawParts();
  drawCube();
  ctx.restore();
  if (flash > 0) {
    ctx.fillStyle = "rgba(255,255,255," + flash * 0.55 + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (state === "ready") {
    // kubus idle melayang di tengah, menunggu tap pertama
    y = H / 2 + Math.sin(now / 450) * 26;
  }
  requestAnimationFrame(frame);
}
canvas.addEventListener("pointerdown", function (e) { e.preventDefault(); flip(); });
window.addEventListener("keydown", function (e) {
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); flip(); }
});
document.addEventListener("visibilitychange", function () {
  if (document.hidden && state === "playing") { state = "ready"; reset(); banner.style.display = "block";
    bannerText.innerHTML = "Jeda otomatis saat tab disembunyikan.<br>Tap untuk mulai lagi dari awal.";
    tapHint.textContent = "TAP UNTUK MULAI"; }
});
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
